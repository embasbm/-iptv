name: Update IPTV list

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sahara.m3u
        run: |
          echo "#EXTM3U" > sahara.m3u
          curl -L https://iptv-org.github.io/iptv/countries/dz.m3u | grep -v "#EXTM3U" >> sahara.m3u
          curl -L https://iptv-org.github.io/iptv/countries/mr.m3u | grep -v "#EXTM3U" >> sahara.m3u
          curl -L https://iptv-org.github.io/iptv/countries/eh.m3u | grep -v "#EXTM3U" >> sahara.m3u
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sahara.m3u
          git commit -m "Update IPTV list" || exit 0
          git push
